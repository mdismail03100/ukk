name: Autonomous 100% Zero-Touch YouTube Shorts Bot (USA Peak Hours)

on:
  # Runs automatically at USA Peak Viewership Hours:
  # 1. 17:00 UTC = 1:00 PM EST (10:00 AM PST) - Lunch & Afternoon Mobile Traffic Peak
  # 2. 23:00 UTC = 7:00 PM EST (4:00 PM PST) - Evening Prime Time Leisure Peak
  schedule:
    - cron: '0 17 * * *'
    - cron: '0 23 * * *'

  # Manual One-Click Trigger anytime
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode'
        required: true
        type: choice
        options:
          - 'autopilot'     # 100% Auto (Fetches clips, tracks, generates, uploads)
          - 'render_only'   # Creates video without uploading
        default: 'autopilot'
      privacy_status:
        description: 'Upload Privacy'
        required: true
        type: choice
        options:
          - public
          - unlisted
          - private
        default: public

jobs:
  autonomous-production-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu fonts-freefont-ttf

      - name: Cache Whisper AI Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-whisper-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-whisper-

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Autonomous Shorts Bot
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ github.event.inputs.privacy_status || 'public' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "render_only" ]; then
            python main.py --render-only
          else
            python -m src.autopilot
          fi

      - name: Save Generated Short as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-us-shorts
          path: output/*.mp4
          retention-days: 14
